<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Vendor Store</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="sh-navbar">
      <div class="sh-container">
        <div class="logo">ShopHub</div>

        <div class="sh-search">
          <input
            type="text"
            placeholder=" 🔍 Search for products, brands and more"
          />
        </div>

        <div class="sh-menu">
          <a href="">🛒 Cart</a>
          <a href="">Become a Seller</a>
          <a href="" class="login-btn">Login</a>
         
          
        </div>
      </div>
    </header>
<section class="hero">
  <div class="hero-container">

    <!-- LEFT TEXT -->
    <div class="hero-text">
      <h1>Everything Your Home & Lifestyle Needs</h1>
      <p>Furniture, decor, gadgets, fashion & more — all in one place!</p>
      <div class="hero-buttons">
        <button class="btn primary" onclick="scrollToCategories()">Shop All Categories</button>
        <button class="btn secondary" onclick="openGiftPopup()">Reveal Your Surprise 🎁</button>
      </div>
    </div>

    <!-- FLOATING CATEGORY ICONS -->
    <div class="floating-icons">
      <span class="icon">🛋️</span>
      <span class="icon">🕶️</span>
      <span class="icon">🎻</span>
      <span class="icon">👗</span>
      <span class="icon">👟</span>
      <span class="icon">👜</span>
      <span class="icon">🧸</span>
      <span class="icon">💻</span>
      <span class="icon">⌚</span>
    </div>

  </div>
</section>


  <!-- CATEGORY SECTION (Scroll target) -->
  <section id="categories">
    <h2>All Categories</h2>
    <!-- Add your categories here -->
  </section>

      <!-- Sliding Gift Box Popup -->
 <!-- GIFT POPUP -->
<div class="gift-popup" id="giftPopup">
  <div class="popup-close" onclick="closeGiftPopup()">×</div>

  <!-- Gift Box -->
  <div class="gift-box" id="giftBox" onclick="openGift()">🎁</div>
  <div class="popup-text" id="popupText">Open me for exciting deals!</div>

  <!-- Offer Cards -->
  <div class="offer-cards" id="offerCards">
    <div class="card" data-offer="🎉 You got 10% OFF!" onclick="chooseCard(this)">🎁 Offer 1</div>
    <div class="card" data-offer="🔥 Flat ₹500 OFF!" onclick="chooseCard(this)">🎁 Offer 2</div>
    <div class="card" data-offer="🚚 Free Delivery!" onclick="chooseCard(this)">🎁 Offer 3</div>
  </div>

  <!-- Offer Result -->
  <div class="offer-result" id="offerResult">
    <p id="offerText"></p>
    <button class="btn primary" onclick="closeGiftPopup()">Claim & Close</button>
  </div>
</div>

    <script src="./js/script.js"></script>


    </body>
    </html>
